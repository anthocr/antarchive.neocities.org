<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley</title>
    <link href="styles/stardew.css" rel="stylesheet" type="text/css" media="all">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ole&display=swap" rel="stylesheet">
</head>

<body>
    <div id="content">
        <!-- Game Description-->
        <header>
            <section>
                <img id="sv-logo" src="https://www.stardewvalley.net/presskit/Stardew%20Valley/images/SDV_logo_3x.png"
                    alt="Stardew Valley logo">
                <p>Description goes here...</p>
            </section>
            <figure>
                <!-- Farmer image goes here-->

            </figure>
        </header>

        <main>
            <!-- Sebastian character profile-->
            <section id="sebastian">
                <figure>
                    <img src="images/stardew/sebastian.png" alt="Portrait of Sebastian">
                    <img src="images/stardew/sebastian-scroll.png" alt="caption for image">
                </figure>
                <p>Sebastian character profile...</p>
            </section>
            <!-- ConcernedApe History -->
            <section id="concerned-ape">
                <figure>
                    <img src="https://www.stardewvalleywiki.com/mediawiki/images/1/1c/Developed_By_Image_small.gif"
                        alt="Developed By ConcernedApe Logo">
                </figure>
        </main>

        <!-- My experience section -->
        <section id="experience">
            <p>My experience playing the game...</p>
            <aside id="screenshots">
                <!--Screenshots go here-->
            </aside>
        </section>
    </div>
</body>

</html>
